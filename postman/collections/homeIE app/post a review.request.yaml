$kind: http-request
url: "{{base_url}}/api/bookings/{{booking_r}}/reviews"
method: POST
body:
  type: json
  content: '{"rating":5,"comment":"Wonderful room, quiet area very close to campus."}'
scripts:
  - type: afterResponse
    code: "pm.test(\"201 created (or 409 if already posted on an earlier run)\", () =>\r

      \  pm.expect([201, 409]).to.include(pm.response.code));\r

      if (pm.response.code === 201) {\r

      \  const d = pm.response.json();\r

      \  pm.test(\"review saved\", () => {\r

      \    pm.expect(d.rating).to.eql(5);\r

      \    pm.expect(d.booking_id).to.eql(Number(pm.collectionVariables.get(\"booking_r\")));\r

      \  });\r

      }"
    language: text/javascript
order: 36000
