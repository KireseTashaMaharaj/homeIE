$kind: http-request
url: "{{base_url}}/api/listings"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"200\", () => pm.response.to.have.status(200));\r

      pm.test(\"new listing is listed\", () => {\r

      \  const ids = pm.response.json().map(l => l.id);\r

      \  pm.expect(ids).to.include(Number(pm.collectionVariables.get(\"listing_id\")));\r

      });"
    language: text/javascript
order: 12000
