$kind: http-request
name: "Fail Test: No Login"
url: "{{base_url}}/api/listings"
method: POST
body:
  type: json
  content: '{"title": "No token test", "address":"12 College Rd", "distance_to_campus":0.8, "price":1800, "room_type":"Private room", "capacity":1, "amenities":"WiFi", "description": "Quiet room.", "photos":["https://example.com/a.jpg"]}'
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.request.headers.remove("Authorization");
    language: text/javascript
  - type: afterResponse
    code: pm.test("401 without token", () => pm.response.to.have.status(401));
    language: text/javascript
order: 8000
