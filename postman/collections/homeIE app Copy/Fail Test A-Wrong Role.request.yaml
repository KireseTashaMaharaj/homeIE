$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"username":"bob","password":"bobpass"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("student login 200", () => pm.response.to.have.status(200));
      const data = pm.response.json();
      const t = data.access_token || data.token;
      pm.test("token present", () => pm.expect(t).to.be.a("string"));
      pm.collectionVariables.set("token", t);
    language: text/javascript
order: 9000
