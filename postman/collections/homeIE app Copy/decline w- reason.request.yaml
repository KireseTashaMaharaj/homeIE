$kind: http-request
name: decline w/ reason
url: "{{base_url}}/api/bookings/{{booking_b}}/decision"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"decision":"decline","decline_reason":"Dates no longer available."}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("declined with reason", () => {
        const d = pm.response.json();
        pm.expect(d.status).to.eql("declined");
        pm.expect(d.decline_reason).to.eql("Dates no longer available.");
      });
    language: text/javascript
order: 24000
