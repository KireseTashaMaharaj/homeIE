$kind: http-request
url: "{{base_url}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"listing_id": {{listing_id}}, "move_in_date": "{{move_in}}", "move_out_date": "{{move_out}}", "roommate_usernames": ["sara"], "message": "Hello, we would like to book this place."}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("created 201", () => pm.response.to.have.status(201));
      const d = pm.response.json();
      pm.test("waiting for roommate", () => {
        pm.expect(d.status).to.eql("pending_roommates");
        pm.expect(d.tenants.length).to.eql(2);
      });
      pm.collectionVariables.set("booking_a", d.id);
    language: text/javascript
order: 14000
