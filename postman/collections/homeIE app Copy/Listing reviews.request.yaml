$kind: http-request
url: "{{base_url}}/api/listings/{{review_listing_id}}/reviews"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const d = pm.response.json();
      pm.test("has reviews and an average", () => {
        pm.expect(d.count).to.be.above(0);
        pm.expect(d.average).to.be.a("number");
        pm.expect(d.reviews[0]).to.have.property("reviewer_first_name");
      });
    language: text/javascript
order: 38000
