$kind: http-request
url: "{{base_url}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\"listing_id\": {{listing_id}}, \"move_in_date\": \"{{move_in}}\", \"move_out_date\": \"{{move_out}}\", \"roommate_usernames\": [], \"message\": \"I'd like to book for just me.\"}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("created 201", () => pm.response.to.have.status(201));
      const d = pm.response.json();
      pm.test("straight to landlord", () => pm.expect(d.status).to.eql("pending_landlord"));
      pm.collectionVariables.set("booking_b", d.id);
    language: text/javascript
order: 19000
