$kind: http-request
url: "{{base_url}}/api/landlord/booking-requests"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("both requests listed", () => {
        const ids = pm.response.json().map(b => b.id);
        pm.expect(ids).to.include(Number(pm.collectionVariables.get("booking_a")));
        pm.expect(ids).to.include(Number(pm.collectionVariables.get("booking_b")));
      });
    language: text/javascript
order: 21000
